<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 캘린더</title>
<meta name="description" content="둘이 함께 쓰는 커플 일정 캘린더">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리 캘린더">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="top">
    <div class="brand">
      <div class="names" id="hdr-names">우리 캘린더</div>
      <div class="dday" id="hdr-dday"></div>
    </div>
    <button type="button" class="sync" id="hdr-sync" data-action="go-settings" data-s="local"><i class="dot"></i><span></span></button>
  </header>

  <main id="main">
    <section class="view" id="view-cal"></section>
    <section class="view" id="view-trips"></section>
    <section class="view" id="view-date"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <button type="button" class="fab" id="fab" data-action="fab" aria-label="추가">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="page-root"></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px">이 앱은 자바스크립트가 켜져 있어야 동작해요.</p></noscript>
<script src="./app.js" defer></script>
</body>
</html>
